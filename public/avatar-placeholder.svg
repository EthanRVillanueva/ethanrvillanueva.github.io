<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" aria-label="Ethan Villanueva placeholder avatar">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>
  
  <!-- Outer glowing background -->
  <rect width="240" height="240" rx="36" fill="url(#avatar-grad)" />
  <rect x="4" y="4" width="232" height="232" rx="32" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Stylized Silhouette Character -->
  <!-- Head -->
  <circle cx="120" cy="92" r="38" fill="currentColor" class="text-gray-400 dark:text-gray-500" opacity="0.85" />
  
  <!-- Modern spectacles accent -->
  <rect x="94" y="84" width="22" height="15" rx="3" fill="none" stroke="#15803D" stroke-width="2.5" />
  <rect x="124" y="84" width="22" height="15" rx="3" fill="none" stroke="#15803D" stroke-width="2.5" />
  <line x1="116" y1="91" x2="124" y2="91" stroke="#15803D" stroke-width="2.5" />

  <!-- Torso / Shoulders -->
  <path d="M56 198 C56 152 84 140 120 140 C156 140 184 152 184 198 Z" fill="currentColor" class="text-gray-400 dark:text-gray-500" opacity="0.85" />
  
  <!-- Monogram badge -->
  <circle cx="178" cy="178" r="22" fill="#15803D" />
  <text x="178" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">EV</text>
</svg>
