<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121614" />
      <stop offset="100%" stop-color="#1A221E" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />

  <!-- Subtle grid pattern -->
  <g stroke="#28322D" stroke-width="1" opacity="0.35">
    <line x1="0" y1="126" x2="1200" y2="126" />
    <line x1="0" y1="252" x2="1200" y2="252" />
    <line x1="0" y1="378" x2="1200" y2="378" />
    <line x1="0" y1="504" x2="1200" y2="504" />
    <line x1="240" y1="0" x2="240" y2="630" />
    <line x1="480" y1="0" x2="480" y2="630" />
    <line x1="720" y1="0" x2="720" y2="630" />
    <line x1="960" y1="0" x2="960" y2="630" />
  </g>

  <!-- Accent Glow -->
  <circle cx="1050" cy="150" r="300" fill="#34D399" opacity="0.12" filter="blur(60px)" />
  <circle cx="150" cy="500" r="250" fill="#15803D" opacity="0.1" filter="blur(60px)" />

  <!-- Content Box -->
  <g transform="translate(100, 151)">
    <!-- Monogram Pill -->
    <rect width="64" height="64" rx="16" fill="url(#accent-grad)" />
    <text x="32" y="42" text-anchor="middle" font-family="'Sora', system-ui, sans-serif" font-weight="700" font-size="24" fill="#FFFFFF">EV</text>

    <!-- Name Heading -->
    <text x="0" y="150" font-family="'Sora', system-ui, sans-serif" font-weight="700" font-size="64" fill="#FFFFFF" letter-spacing="-1">Ethan Villanueva</text>
    
    <!-- Subtitle -->
    <text x="0" y="212" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="28" fill="#34D399">Software Engineer · University of Nottingham</text>

    <!-- URL pill -->
    <rect x="0" y="280" width="340" height="48" rx="24" fill="#1A201D" stroke="#28322D" stroke-width="1.5" />
    <text x="24" y="311" font-family="'JetBrains Mono', monospace" font-size="17" fill="#E8EBE9">ethanrvillanueva.github.io</text>
  </g>
</svg>
